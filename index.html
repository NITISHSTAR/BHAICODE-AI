<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BHAICODE AI</title>
    <style>
        body { font-family: Arial; background: #111; color: white; padding: 20px; }
        #chatbox { width: 100%; height: 400px; background: #222; padding: 10px; overflow-y: auto; border-radius: 10px; }
        #input { width: 80%; padding: 10px; border-radius: 5px; border: none; }
        #send { padding: 10px 20px; border: none; background: #0f0; color: black; border-radius: 5px; }
        .msg { margin: 10px 0; padding: 10px; background: #333; border-radius: 5px; }
        .user { background: #0a0; }
    </style>
</head>
<body>

<h2>BHAICODE AI – Gemini Chatbot</h2>

<div id="chatbox"></div>

<br>

<input id="input" type="text" placeholder="Type your message...">
<button id="send">Send</button>

<script>
    const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY_HERE";  // <-- Yaha apni key daalni hai

    async function askGemini(message) {
        const response = await fetch(
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=" + GEMINI_API_KEY,
            {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ role: "user", parts: [{ text: message }] }]
                })
            }
        );

        const data = await response.json();
        return data.candidates?.[0]?.content?.parts?.[0]?.text || "Error: No response";
    }

    document.getElementById("send").onclick = async () => {
        const input = document.getElementById("input");
        const chatbox = document.getElementById("chatbox");

        let userMsg = document.createElement("div");
        userMsg.className = "msg user";
        userMsg.textContent = input.value;
        chatbox.appendChild(userMsg);

        const reply = await askGemini(input.value);

        let botMsg = document.createElement("div");
        botMsg.className = "msg";
        botMsg.textContent = reply;
        chatbox.appendChild(botMsg);

        input.value = "";
        chatbox.scrollTop = chatbox.scrollHeight;
    };
</script>

</body>
</html>
